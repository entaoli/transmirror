const ACCENT_HUE = 240;
const accent      = `oklch(0.62 0.2 ${ACCENT_HUE})`;
const accentBg    = `oklch(0.62 0.2 ${ACCENT_HUE} / 0.12)`;
const accentBorder= `oklch(0.62 0.2 ${ACCENT_HUE} / 0.35)`;

// ── Icons ────────────────────────────────────────────────────────────────────
const Icon = ({ name, size = 16, color = 'currentColor' }) => {
  const icons = {
    chevronLeft:  <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    chevronRight: <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    chevronDown:  <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    file:   <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d="M9 2H4a1 1 0 00-1 1v10a1 1 0 001 1h8a1 1 0 001-1V6L9 2z" stroke={color} strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/><path d="M9 2v4h4" stroke={color} strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    check:  <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d="M3 8l4 4 6-7" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    refresh:<svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d="M13 8A5 5 0 113 8" stroke={color} strokeWidth="1.4" strokeLinecap="round"/><path d="M13 4v4h-4" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    save:   <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d="M3 2h8l3 3v9a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z" stroke={color} strokeWidth="1.3"/><path d="M5 2v4h6V2M5 14v-5h6v5" stroke={color} strokeWidth="1.3" strokeLinecap="round"/></svg>,
    diff:   <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="5" height="12" rx="1" stroke={color} strokeWidth="1.3"/><rect x="9" y="2" width="5" height="12" rx="1" stroke={color} strokeWidth="1.3"/></svg>,
    sparkle:<svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d="M8 2l1.2 3.8L13 7l-3.8 1.2L8 12l-1.2-3.8L3 7l3.8-1.2L8 2z" stroke={color} strokeWidth="1.3" strokeLinejoin="round"/></svg>,
    globe:  <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke={color} strokeWidth="1.3"/><path d="M8 2c-2 2-2 8 0 12M8 2c2 2 2 8 0 12M2 8h12" stroke={color} strokeWidth="1.2"/></svg>,
    copy:   <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="1" stroke={color} strokeWidth="1.3"/><path d="M11 5V3a1 1 0 00-1-1H3a1 1 0 00-1 1v7a1 1 0 001 1h2" stroke={color} strokeWidth="1.3" strokeLinecap="round"/></svg>,
    arrowUp:<svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d="M8 13V3M4 7l4-4 4 4" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    eye:      <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke={color} strokeWidth="1.3"/><circle cx="8" cy="8" r="2" stroke={color} strokeWidth="1.3"/></svg>,
    expand:   <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d="M10 2h4v4M6 14H2v-4M14 10v4h-4M2 6V2h4" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    compress: <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d="M14 6h-4V2M2 10h4v4M6 2v4H2M10 14v-4h4" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    eyeOff: <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d="M2 2l12 12M6.5 6.6A2 2 0 0010 10M4.2 4.3C2.6 5.4 1 8 1 8s2.5 5 7 5c1.4 0 2.7-.4 3.8-1M7 3.1C7.3 3 7.7 3 8 3c4.5 0 7 5 7 5s-.6 1.2-1.6 2.4" stroke={color} strokeWidth="1.3" strokeLinecap="round"/></svg>,
  };
  return icons[name] || null;
};

// ── Simple diff markdown renderer ────────────────────────────────────────────
function renderDiffMarkdown(text) {
  // Convert ~~deleted~~ → <s> and **added** → <strong>, then basic markdown
  const escaped = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const html = escaped
    .replace(/~~(.*?)~~/g, '<s style="color:#b05050;background:rgba(180,80,80,0.1);border-radius:2px;padding:0 2px">$1</s>')
    .replace(/\*\*(.*?)\*\*/g, '<strong style="color:#3a8a4a;background:rgba(60,140,80,0.1);border-radius:2px;padding:0 2px">$1</strong>')
    .replace(/\n/g, '<br/>');
  return { __html: html };
}

// ── Main App ─────────────────────────────────────────────────────────────────
function TermsPanel({ matched, excluded, isOpen, onToggle }) {
  const hasMatched  = Object.keys(matched).length > 0;
  const hasExcluded = Object.keys(excluded).length > 0;
  if (!hasMatched && !hasExcluded) return null;
  return (
    <div style={{marginTop: 10}}>
      <button onClick={onToggle} style={{
        fontSize: 10.5, padding: '2px 10px', borderRadius: 5,
        border: '1px solid rgba(76,175,80,0.35)',
        background: isOpen ? 'rgba(76,175,80,0.12)' : 'rgba(76,175,80,0.06)',
        color: '#388e3c',
        cursor: 'pointer', fontFamily: "'IBM Plex Sans', sans-serif",
        fontWeight: 500, display: 'inline-flex', alignItems: 'center', gap: 4,
      }}>匹配词条 {isOpen ? '▲' : '▼'}</button>
      {isOpen && (
        <div style={{
          marginTop: 8, padding: '10px 12px', borderRadius: 8,
          background: '#f8f8f9',
          border: '1px solid #e0e0e0',
        }}>
          {hasMatched && (
            <div style={{marginBottom: hasExcluded ? 8 : 0}}>
              <div style={{fontSize: 10.5, color: '#388e3c', marginBottom: 5}}>使用的词条</div>
              <div style={{display: 'flex', flexWrap: 'wrap', gap: 4}}>
                {Object.entries(matched).map(([zh, en]) => (
                  <span key={zh} style={{
                    fontSize: 10.5, padding: '1px 8px', borderRadius: 10,
                    background: 'rgba(76,175,80,0.08)', border: '1px solid rgba(76,175,80,0.25)',
                    color: '#2e7d32', fontFamily: "'IBM Plex Sans', sans-serif",
                  }}>{zh} · {en}</span>
                ))}
              </div>
            </div>
          )}
          {hasExcluded && (
            <div>
              <div style={{fontSize: 10.5, color: '#e65100', marginBottom: 5}}>排除的词条（交 AI 发挥）</div>
              <div style={{display: 'flex', flexWrap: 'wrap', gap: 4}}>
                {Object.entries(excluded).map(([zh, en]) => (
                  <span key={zh} style={{
                    fontSize: 10.5, padding: '1px 8px', borderRadius: 10,
                    background: 'rgba(255,152,0,0.08)', border: '1px solid rgba(255,152,0,0.3)',
                    color: '#e65100', fontFamily: "'IBM Plex Sans', sans-serif",
                  }}>{zh} · {en}</span>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [sidebarCollapsed, setSidebarCollapsed] = React.useState(false);
  const [repo, setRepo]               = React.useState('help');
  const [repoList, setRepoList]       = React.useState([
    {id:'help', label:'Help Center', hapEnabled:true, configured:false, root:''},
    {id:'docs', label:'Docs (私有部署)', hapEnabled:false, configured:false, root:''},
  ]);
  const [pickingFolder, setPickingFolder] = React.useState(null); // null | 'help' | 'docs'
  const [controlsCollapsed, setControlsCollapsed] = React.useState(false);
  const [dataSource, setDataSource]   = React.useState('hap');
  const [filterStatus, setFilterStatus] = React.useState('待翻译');
  const [commits, setCommits]         = React.useState([]);
  const [selectedCommit, setSelectedCommit] = React.useState('');
  const [commitsLoading, setCommitsLoading] = React.useState(false);
  const [loadState, setLoadState]     = React.useState('idle'); // idle | loading | loaded | error
  const [files, setFiles]             = React.useState([]);
  const [changes, setChanges]         = React.useState([]);
  const [commitInfo, setCommitInfo]   = React.useState(null);
  const [selectedFile, setSelectedFile]     = React.useState(null);
  const [selectedChange, setSelectedChange] = React.useState(null);
  const [editedContent, setEditedContent]   = React.useState({});
  const [savedState, setSavedState]         = React.useState({});
  const [markedDone, setMarkedDone]         = React.useState({});
  const [copiedId, setCopiedId]             = React.useState(null);
  const [localSuggestions, setLocalSuggestions] = React.useState({});
  const [localMatched, setLocalMatched]         = React.useState({});
  const [localExcluded, setLocalExcluded]       = React.useState({});
  const [showTermsId, setShowTermsId]           = React.useState(null);
  const [suggestingIds, setSuggestingIds]       = React.useState(new Set());
  const textareaRef = React.useRef(null);
  const [showDiff, setShowDiff]       = React.useState(false);
  const [showEnPreview, setShowEnPreview] = React.useState(false);
  const [enFullscreen, setEnFullscreen]   = React.useState(false);
  React.useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') setEnFullscreen(false); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);

  const reposLoadedRef = React.useRef(false);

  const refreshRepos = () =>
    fetch('/api/repos').then(r => r.json()).then(data => {
      if (Array.isArray(data)) setRepoList(data);
      return data;
    }).catch(() => repoList);

  // 选择并保存仓库路径（pick + set）
  const handleConfigRepo = async (targetRepo) => {
    setPickingFolder(targetRepo);
    try {
      const pickRes = await fetch('/api/pick-folder');
      const pickData = await pickRes.json();
      if (!pickData.path) return; // 用户取消
      await fetch('/api/set-repo-path', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({repo: targetRepo, path: pickData.path}),
      });
      await refreshRepos();
    } finally {
      setPickingFolder(null);
    }
  };

  // Load repo list on mount; after loaded, auto-pick only if truly unconfigured
  React.useEffect(() => {
    refreshRepos().then(data => {
      reposLoadedRef.current = true;
      const cur = data.find(r => r.id === repo);
      if (cur && !cur.configured) handleConfigRepo(repo);
    });
  }, []);

  // Derived: current repo config
  const currentRepoCfg = repoList.find(r => r.id === repo) || repoList[0];
  const effectiveRoot = currentRepoCfg?.root || '';

  // When repo changes: reset commits, force git if HAP disabled, auto-pick if unconfigured
  React.useEffect(() => {
    if (!reposLoadedRef.current) return; // 等初始加载完成后再响应
    if (currentRepoCfg && !currentRepoCfg.hapEnabled && dataSource === 'hap') {
      setDataSource('git');
    }
    setCommits([]);
    setSelectedCommit('');
    if (currentRepoCfg && !currentRepoCfg.configured) {
      handleConfigRepo(repo);
    }
  }, [repo]);

  // Load commits when switching to git mode or repo changes
  React.useEffect(() => {
    if (dataSource === 'git' && effectiveRoot) {
      setCommitsLoading(true);
      setCommits([]);
      fetch(`/api/commits?repo=${repo}&root=${encodeURIComponent(effectiveRoot)}`)
        .then(r => r.json()).then(data => {
          if (Array.isArray(data)) {
            setCommits(data);
            if (data.length > 0) setSelectedCommit(data[0].hash);
          }
        })
        .catch(() => {})
        .finally(() => setCommitsLoading(false));
    }
  }, [dataSource, repo, effectiveRoot]);

  const handleLoad = async () => {
    setLoadState('loading');
    try {
      const rootParam = effectiveRoot ? `&root=${encodeURIComponent(effectiveRoot)}` : '';
      const url = dataSource === 'hap'
        ? `/api/load/hap?status=${encodeURIComponent(filterStatus)}&repo=${repo}`
        : `/api/load/git?commit=${selectedCommit || 'HEAD'}&repo=${repo}${rootParam}`;
      const res  = await fetch(url);
      const data = await res.json();
      if (data.error) { setLoadState('error'); return; }

      const newFiles   = data.files   || [];
      const newChanges = data.changes || [];
      setFiles(newFiles);
      setChanges(newChanges);
      if (data.info) setCommitInfo(data.info);
      setEditedContent({});
      const initDone = {};
      newChanges.forEach(c => { if (c.status === 'done') initDone[c.id] = true; });
      setMarkedDone(initDone);
      if (newFiles.length > 0) {
        setSelectedFile(newFiles[0].id);
        const first = newChanges.find(c => c.fileId === newFiles[0].id);
        if (first) setSelectedChange(first.id);
      }
      setLoadState('loaded');
    } catch (e) {
      setLoadState('error');
    }
  };

  const handleSave = async () => {
    const currentFile = files.find(f => f.id === selectedFile);
    if (!currentFile) return;
    const content = editedContent[selectedFile] ?? currentFile.enContent;
    await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file_path: currentFile.enPath, content, repo, root: effectiveRoot }),
    });
    setSavedState(p => ({ ...p, [selectedFile]: true }));
    setTimeout(() => setSavedState(p => { const n = {...p}; delete n[selectedFile]; return n; }), 2000);
  };

  const effectiveSuggestion = (ch) =>
    ch && (localSuggestions[ch.id] || ch.aiSuggestion || null);

  const parseTermsText = (text) => {
    if (!text) return {};
    const result = {};
    text.split('\n').forEach(line => {
      const idx = line.indexOf(' → ');
      if (idx > 0) result[line.slice(0, idx).trim()] = line.slice(idx + 3).trim();
    });
    return result;
  };

  const effectiveMatchedTerms = (ch) => {
    if (!ch) return {};
    const fromHap = parseTermsText(ch.matchedTerms || '');
    const fromApi = localMatched[ch.id] || {};
    return {...fromHap, ...fromApi};
  };

  const effectiveExcludedTerms = (ch) => {
    if (!ch) return {};
    const fromHap = parseTermsText(ch.excludedTerms || '');
    const fromApi = localExcluded[ch.id] || {};
    return {...fromHap, ...fromApi};
  };

  const handleGetSuggestion = async () => {
    if (!currentChange) return;
    const id = currentChange.id;
    setSuggestingIds(p => new Set([...p, id]));
    try {
      const r = await fetch('/api/translate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({zh_text: currentChange.chineseAfter})
      });
      const d = await r.json();
      if (d.suggested) {
        setLocalSuggestions(p => ({...p, [id]: d.suggested}));
        if (dataSource === 'hap' && currentChange.rowid) {
          await fetch(`/api/save-suggestion/${currentChange.rowid}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({suggested: d.suggested})
          });
        }
      }
      if (d.matched)  setLocalMatched(p => ({...p, [id]: d.matched}));
      if (d.excluded) setLocalExcluded(p => ({...p, [id]: d.excluded}));
    } finally {
      setSuggestingIds(p => { const s = new Set(p); s.delete(id); return s; });
    }
  };

  const handleCopyAndLocate = async () => {
    const sug = effectiveSuggestion(currentChange);
    if (!sug) return;
    await navigator.clipboard.writeText(sug);
    setCopiedId(currentChange.id);
    setTimeout(() => setCopiedId(null), 2000);

    if (currentChange.anchor && textareaRef.current) {
      const content = editorValue;
      const anchorText = `{#${currentChange.anchor}}`;
      const idx = content.indexOf(anchorText);
      if (idx !== -1) {
        const ta = textareaRef.current;
        ta.focus();
        ta.setSelectionRange(idx, idx + anchorText.length);
        requestAnimationFrame(() => {
          // Mirror div accurately measures rendered text height up to anchor position
          const mirror = document.createElement('div');
          const cs = window.getComputedStyle(ta);
          mirror.style.cssText = [
            'position:absolute', 'top:-9999px', 'left:-9999px', 'visibility:hidden',
            `width:${ta.clientWidth}px`,
            `font-size:${cs.fontSize}`, `font-family:${cs.fontFamily}`,
            `line-height:${cs.lineHeight}`, `padding:${cs.padding}`,
            `border:${cs.border}`, 'white-space:pre-wrap', 'word-break:break-word',
            'box-sizing:border-box', 'overflow-wrap:break-word',
          ].join(';');
          mirror.textContent = content.substring(0, idx);
          document.body.appendChild(mirror);
          const textHeight = mirror.scrollHeight;
          document.body.removeChild(mirror);
          ta.scrollTop = Math.max(0, textHeight - ta.clientHeight / 5);
        });
      }
    }
  };

  const handleMarkDone = async () => {
    if (!currentChange) return;
    if (currentChange.rowid && dataSource === 'hap') {
      await fetch(`/api/approve/${currentChange.rowid}`, { method: 'POST' });
    }
    setMarkedDone(p => ({ ...p, [selectedChange]: true }));
    const next = fileChanges.find(c => c.id !== selectedChange && !markedDone[c.id] && c.status !== 'done');
    if (next) setSelectedChange(next.id);
  };

  const fileChanges   = changes.filter(c => c.fileId === selectedFile);
  const currentChange = fileChanges.find(c => c.id === selectedChange) || fileChanges[0];
  const currentFile   = files.find(f => f.id === selectedFile);
  const editorValue   = editedContent[selectedFile] ?? currentFile?.enContent ?? '';

  const getStatus = (c) => markedDone[c.id] ? 'done' : c.status;
  const totalChanges  = files.reduce((s, f) => s + f.changes, 0);
  const totalDone     = files.reduce((s, f) => s + f.done, 0) + Object.keys(markedDone).length;
  const progress      = totalChanges > 0 ? Math.round((totalDone / totalChanges) * 100) : 0;

  const css = `
    .app { display: flex; height: 100vh; background: #f8f8f9; color: #333; }

    .sidebar {
      width: ${sidebarCollapsed ? '52px' : '220px'};
      min-width: ${sidebarCollapsed ? '52px' : '220px'};
      background: #0B1F19; display: flex; flex-direction: column;
      transition: width 0.22s ease, min-width 0.22s ease;
      overflow: hidden; border-right: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-header {
      height: 52px; display: flex; align-items: center;
      padding: 0 14px; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0;
    }
    .sidebar-logo {
      width: 26px; height: 26px; border-radius: 6px;
      background: ${accent}; display: flex; align-items: center; justify-content: center;
      font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500;
      color: white; flex-shrink: 0; letter-spacing: -0.5px;
    }
    .sidebar-title {
      font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.88);
      white-space: nowrap; overflow: hidden;
      opacity: ${sidebarCollapsed ? 0 : 1}; transition: opacity 0.15s;
    }
    .collapse-btn {
      margin-left: auto; width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; cursor: pointer; flex-shrink: 0;
      color: rgba(255,255,255,0.4); transition: background 0.15s, color 0.15s;
    }
    .collapse-btn:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); }

    .sidebar-section {
      padding: 14px 12px 8px;
      opacity: ${sidebarCollapsed ? 0 : 1}; transition: opacity 0.12s; overflow: hidden;
    }
    .sidebar-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
      color: rgba(255,255,255,0.28); text-transform: uppercase; margin-bottom: 8px; padding: 0 4px;
    }
    .radio-group { display: flex; flex-direction: column; gap: 2px; }
    .radio-item {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px;
      border-radius: 6px; cursor: pointer; font-size: 12.5px;
      color: rgba(255,255,255,0.55); transition: background 0.12s, color 0.12s;
    }
    .radio-item:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8); }
    .radio-item.active { background: ${accentBg}; color: rgba(255,255,255,0.9); }
    .radio-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: border-color 0.12s;
    }
    .radio-item.active .radio-dot { border-color: ${accent}; }
    .radio-inner { width: 7px; height: 7px; border-radius: 50%; background: ${accent}; opacity: 0; transition: opacity 0.12s; }
    .radio-item.active .radio-inner { opacity: 1; }

    .filter-select {
      width: 100%; padding: 7px 10px; border-radius: 7px; font-size: 12.5px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.75); font-family: 'IBM Plex Sans', sans-serif;

    @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }

    .editor-textarea {

          transition: 'max-height 0.25s ease',
          flexShrink: 0,

                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    cursor: 'pointer', color: 'rgba(255,255,255,0.3)',
                    background: pickingFolder === r.id ? 'rgba(255,255,255,0.1)' : 'transparent',

                  </svg>

              const sources = hapEnabled

              return sources.map(([val, label]) => (
                <div key={val} className={`radio-item ${dataSource === val ? 'active' : ''}`}

                  <div className="radio-dot"><div className="radio-inner"/></div>
                  <span>{label}</span>
                </div>

            })()}

        </div>

        {dataSource === 'hap' && (
          <div className="sidebar-section" style={{paddingTop: 0}}>
            <div className="sidebar-label">筛选状态</div>
            <div className="select-wrap">
              <select className="filter-select" value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>

                <option>已翻译</option>

              <span className="select-arrow"><Icon name="chevronDown" size={12}/></span>
            </div>
          </div>

          <div className="status-pill">
            {files.length} 个文件 · {totalChanges} 个变更章节

          </div>

        {loadState === 'error' && (
          <div className="status-pill" style={{background:'oklch(0.55 0.16 25 / 0.15)', borderColor:'oklch(0.55 0.16 25 / 0.3)', color:'oklch(0.75 0.14 25)'}}>

          <div className="progress-bar-wrap">

            <div className="progress-track">
              <div className="progress-fill" style={{width: `${progress}%`}}/>
            </div>
            <span className="progress-text">翻译进度 {progress}%</span>
          </div>
        )}

        <div className="content-area">
          {/* Change list */}
          <div className="change-panel">
            <div className="change-panel-header">
              <span className="panel-title">变更列表</span>
              <span className="panel-count">{fileChanges.length} 条</span>
            </div>
            <div className="change-list">
              {fileChanges.length === 0 && (
                <div style={{padding: '20px 0', textAlign: 'center', color: '#bbb', fontSize: 13}}>
                  {loadState === 'idle' ? '← 请先加载数据' : '暂无变更'}
                </div>
              )}
              {fileChanges.map(c => {
                const st = getStatus(c);
                return (
                  <div key={c.id} className={`change-card ${selectedChange === c.id ? 'active' : ''}`}
                    onClick={() => setSelectedChange(c.id)}>
                    <div className="card-top">
                      <span className="card-anchor">{c.anchor ? `#${c.anchor}` : '⚠️ 无锚点'}</span>
                      <div style={{display:'flex', gap:4, alignItems:'center', flexShrink:0}}>
                        {c.changeMeta && (
                          <span className={`change-meta ${c.changeMeta.type}`}>{c.changeMeta.label}</span>
                        )}
                        {st === 'done' && <span className="status-badge done">已翻译</span>}
                      </div>
                    </div>
                    <div className="card-preview">{c.chineseAfter}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Editor */}
          {currentChange ? (
            <div className="editor-area">
              <div className="editor-panes">
                {/* Chinese pane */}
                <div className="cn-pane">
                  <div className="pane-header">
                    <span className="pane-tag cn">中文</span>
                    <span className="pane-path">{currentChange.anchor ? `#${currentChange.anchor}` : '无锚点'}</span>
                    {currentChange.diffAnnotation && currentChange.diffAnnotation !== currentChange.chineseAfter ? (
                      <button onClick={() => setShowDiff(p => !p)} style={{
                        marginLeft: 'auto', flexShrink: 0, fontSize: 11, padding: '3px 9px',
                        borderRadius: 5, border: showDiff ? '1px solid #c8c6be' : '1px solid #e0dfd9',
                        background: showDiff ? '#eae9e3' : 'white', color: showDiff ? '#444' : '#888',
                        cursor: 'pointer', fontFamily: "'IBM Plex Sans', sans-serif", fontWeight: 500,
                        display: 'flex', alignItems: 'center', gap: 4, transition: 'all 0.15s',
                      }}>
                        <Icon name="diff" size={11}/>
                        {showDiff ? '收起对比' : '变更对比'}
                      </button>
                    ) : (
                      <span style={{marginLeft:'auto', fontSize:11, color:'#bbb', fontStyle:'italic'}}>
                        无变更对比
                      </span>
                    )}
                  </div>
                  <div className="pane-content">
                    {showDiff && currentChange.diffAnnotation ? (
                      <div className="diff-section">
                        <div className="diff-label after">
                          <div className="diff-label-dot"/>变更对比
                        </div>
                        <div className="diff-block diff-view"
                          dangerouslySetInnerHTML={renderDiffMarkdown(currentChange.diffAnnotation)}/>
                      </div>
                    ) : (
                      <>
                        <div className="diff-section">
                          <div className="diff-label after">
                            <div className="diff-label-dot"/>变更后（翻译目标）
                          </div>
                          <div className="diff-block after">{currentChange.chineseAfter}</div>
                        </div>
                        <TermsPanel
                          matched={effectiveMatchedTerms(currentChange)}
                          excluded={effectiveExcludedTerms(currentChange)}
                          isOpen={showTermsId === currentChange.id}
                          onToggle={() => setShowTermsId(showTermsId === currentChange.id ? null : currentChange.id)}
                        />
                        {effectiveSuggestion(currentChange) && (
                          <div className="diff-section">
                            <div className="diff-label" style={{
                              color: `oklch(0.52 0.18 ${ACCENT_HUE})`,
                              justifyContent: 'space-between'
                            }}>
                              <span style={{display:'flex', alignItems:'center', gap:6}}>
                                <Icon name="sparkle" size={12}/>AI 建议译文
                              </span>
                              <button onClick={handleCopyAndLocate} style={{
                                fontSize: 10.5, padding: '2px 9px', borderRadius: 5,
                                border: `1px solid oklch(0.62 0.18 ${ACCENT_HUE} / 0.4)`,
                                background: copiedId === currentChange.id
                                  ? `oklch(0.58 0.18 145 / 0.15)`
                                  : `oklch(0.62 0.18 ${ACCENT_HUE} / 0.08)`,
                                color: copiedId === currentChange.id
                                  ? `oklch(0.45 0.14 145)`
                                  : `oklch(0.45 0.18 ${ACCENT_HUE})`,
                                cursor: 'pointer', fontFamily: "'IBM Plex Sans', sans-serif",
                                fontWeight: 500, display:'flex', alignItems:'center', gap:4,
                                transition: 'all 0.2s',
                              }}>
                                <Icon name={copiedId === currentChange.id ? 'check' : 'copy'} size={10}/>
                                {copiedId === currentChange.id ? '已复制' : '复制 & 定位'}
                              </button>
                            </div>
                            <div style={{
                              fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, lineHeight: 1.7,
                              padding: '12px 14px', borderRadius: 8, whiteSpace: 'pre-wrap', wordBreak: 'break-word',
                              background: `oklch(0.62 0.18 ${ACCENT_HUE} / 0.07)`,
                              border: `1px solid oklch(0.62 0.18 ${ACCENT_HUE} / 0.22)`,
                              color: `oklch(0.3 0.1 ${ACCENT_HUE})`,
                            }}>{effectiveSuggestion(currentChange)}</div>
                          </div>
                        )}
                        {!effectiveSuggestion(currentChange) && dataSource === 'hap' && (
                          <div style={{marginTop: 12, textAlign: 'center', padding: '10px 0'}}>
                            <button onClick={handleGetSuggestion}
                              disabled={suggestingIds.has(currentChange.id)}
                              style={{
                                fontSize: 12, padding: '5px 14px', borderRadius: 6,
                                border: `1px solid oklch(0.62 0.18 ${ACCENT_HUE} / 0.4)`,
                                background: `oklch(0.62 0.18 ${ACCENT_HUE} / 0.08)`,
                                color: `oklch(0.45 0.18 ${ACCENT_HUE})`,
                                cursor: suggestingIds.has(currentChange.id) ? 'default' : 'pointer',
                                fontFamily: "'IBM Plex Sans', sans-serif", fontWeight: 500,
                                display: 'inline-flex', alignItems: 'center', gap: 5,
                                opacity: suggestingIds.has(currentChange.id) ? 0.6 : 1,
                              }}>
                              <Icon name="sparkle" size={12}/>
                              {suggestingIds.has(currentChange.id) ? '翻译中…' : '获取建议译文'}
                            </button>
                          </div>
                        )}
                        {!effectiveSuggestion(currentChange) && dataSource === 'git' && (
                          <div style={{marginTop: 12, textAlign: 'center', padding: '10px 0'}}>
                            <button onClick={handleGetSuggestion}
                              disabled={suggestingIds.has(currentChange.id)}
                              style={{
                                fontSize: 12, padding: '5px 14px', borderRadius: 6,
                                border: `1px solid oklch(0.62 0.18 ${ACCENT_HUE} / 0.4)`,
                                background: `oklch(0.62 0.18 ${ACCENT_HUE} / 0.08)`,
                                color: `oklch(0.45 0.18 ${ACCENT_HUE})`,
                                cursor: suggestingIds.has(currentChange.id) ? 'default' : 'pointer',
                                fontFamily: "'IBM Plex Sans', sans-serif", fontWeight: 500,
                                display: 'inline-flex', alignItems: 'center', gap: 5,
                                opacity: suggestingIds.has(currentChange.id) ? 0.6 : 1,
                              }}>
                              <Icon name="sparkle" size={12}/>
                              {suggestingIds.has(currentChange.id) ? '翻译中…' : '获取建议译文'}
                            </button>
                          </div>
                        )}
                      </>
                    )}
                  </div>
                </div>

                {/* English editor pane */}
                <div className={`en-pane${enFullscreen ? ' fullscreen' : ''}`}>
                  <div className="pane-header" style={{background:'#fafaf8', borderBottom:'1px solid #e8e7e3'}}>
                    <span className="pane-tag en">英文</span>
                    <span className="pane-path">{currentFile?.enPath || '（新建）'}</span>
                  </div>
                  <div className="en-toolbar">
                    <button className="toolbar-btn" onClick={() => setEditedContent(p => ({...p, [selectedFile]: currentFile?.enContent ?? ''}))}>
                      <Icon name="copy" size={12}/>重置
                    </button>
                    <button className={`toolbar-btn ${showEnPreview ? 'primary' : ''}`}
                      onClick={() => setShowEnPreview(p => !p)}>
                      <Icon name={showEnPreview ? 'eyeOff' : 'eye'} size={12}/>
                      {showEnPreview ? '编辑' : '预览'}
                    </button>
                    <button className={`toolbar-btn ${enFullscreen ? 'primary' : ''}`}
                      onClick={() => setEnFullscreen(p => !p)}>
                      <Icon name={enFullscreen ? 'compress' : 'expand'} size={12}/>
                      {enFullscreen ? '退出全屏' : '全屏'}
                    </button>
                    <div className="toolbar-spacer"/>
                    {savedState[selectedFile] && (
                      <span className="saved-indicator"><Icon name="check" size={12}/>已保存</span>
                    )}
                    <button className="toolbar-btn" onClick={handleSave}>
                      <Icon name="save" size={12}/>保存
                    </button>
                    <button className={`toolbar-btn ${getStatus(currentChange) === 'done' ? 'success' : 'primary'}`}
                      onClick={handleMarkDone}>
                      {getStatus(currentChange) === 'done'
                        ? <><Icon name="check" size={12}/> 已翻译</>
                        : <><Icon name="arrowUp" size={12}/> 已完成</>}
                    </button>
                  </div>
                  {showEnPreview ? (
                    <div className="md-preview"
                      dangerouslySetInnerHTML={{ __html: marked.parse(
                        (editorValue || '')
                          .replace(/@site\/static\//g, '/repo-static/')
                          .replace(/\.\.\/(img\/)/g, '/en-img/')
                      )}}
                    />
                  ) : (
                    <textarea
                      ref={textareaRef}
                      className="editor-textarea"
                      value={editorValue}
                      onChange={e => setEditedContent(p => ({...p, [selectedFile]: e.target.value}))}
                      placeholder="在此编辑英文翻译内容…"
                      spellCheck={false}
                    />
                  )}
                </div>
              </div>
            </div>
          ) : (
            <div className="editor-area">
              <div className="empty-state">
                <div className="empty-state-icon">📝</div>
                <div className="empty-state-text">
                  {loadState === 'idle' ? '选择数据来源，点击加载按钮开始审校' : '从左侧选择变更章节'}
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
